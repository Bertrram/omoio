[package]
name = "omoio"
version = "0.2.4"
description = "A game library for Windows that sets up and runs PS3 and Wii U games through RPCS3 and Cemu"
authors = ["Bertram Bech"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows.
name = "omoio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
# UI Automation, with the COM pieces it needs, reaches RPCS3's Qt windows,
# whose widgets are not windows of their own. See backends/rpcs3/portal.rs.
# The HID and device-setup pieces read pads the way Cemu's SDL does, to name
# them in its profiles. See backends/cemu/sdl.rs.
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
sevenz-rust2 = "0.22"
zip = "4"
tokio = { version = "1", features = ["fs", "io-util"] }
futures-util = "0.3"
sha2 = "0.11"
# RPCS3's patch file is real YAML: anchors, aliases, and the same key repeated
# at the top level. Only used to read it; our own files keep the small writer
# in game_config.rs.
yaml-rust2 = "0.10"
# All three are already in the build as dependencies of something else, so
# naming them here adds no new code. Sony's update manifest is XML, its
# packages are checksummed with SHA-1, and reaching the manifest needs a
# certificate check of our own. See updates.rs.
quick-xml = "0.41"
sha1 = "0.10"
rustls = { version = "0.23", default-features = false }
# Reads which gamepads are plugged in, so the profile Omoio writes for the
# emulator names the controller that is actually there. Pure Rust, no DLL to
# ship. See backends/rpcs3/controllers.rs.
gilrs = "0.11"
# Reads which villain a Trap Team trap holds, for the portal menu: a figure's
# data is encrypted with AES under a key made with MD5. Read only. aes is
# already in the build through sevenz-rust2, and md-5 shares sha2's pieces.
# See core/figure_data.rs.
aes = "0.9"
md-5 = "0.11"
# Already in the build: Tauri uses it to read the app's icons as it builds,
# so naming it here adds no new crate. A Wii U dump's own picture is a TGA,
# which the webview can't show, so it is written out as a PNG for its tile.
# 0.17 is the version Tauri's build uses; 0.18 is in Cargo.lock only for
# macOS. See core/tga.rs.
png = "0.17"
# Already in the build through zip, the same version, so naming it adds no
# new crate. A Wii U game kept as a .wua, Cemu's own archive, has its files
# in zstd blocks, and its meta.xml is read from there. See backends/cemu/wua.rs.
zstd = "0.13"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
