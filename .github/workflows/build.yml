name: Build installer

# Builds the Windows installer from the tagged source on GitHub's own machines,
# so anyone can see a release comes from the code in this repository.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notes:
        description: "What Omoio's update prompt says about this version"
        required: false
        default: ""
      # Filled in only to publish an installer an earlier run built. The
      # build is then skipped, and the publish job below runs instead.
      publish_run:
        description: "Publish the installer from this earlier run (its run id)"
        required: false
        default: ""
      tag:
        description: "The release's tag, such as v0.3.2"
        required: false
        default: ""
      title:
        description: "The release's title"
        required: false
        default: ""
      target:
        description: "The commit the tag goes on"
        required: false
        default: ""
      release_notes:
        description: "The release's text"
        required: false
        default: ""

# No token rights by default; each job asks only for what it needs.
permissions: {}

jobs:
  windows:
    if: inputs.publish_run == ''
    runs-on: windows-latest
    timeout-minutes: 60
    # Read the code, nothing else. The token cannot push, tag or publish.
    permissions:
      contents: read
    steps:
      # Actions are pinned to full commit SHAs, so a moved or hijacked tag
      # cannot change what runs next to the signing key.
      # Don't leave the GitHub token on disk for the later steps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No npm cache: a cache can be written by other runs, and anything
      # restored from it runs in the same job as the signing key.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install frontend packages
        run: npm ci

      # The icon set is generated, never committed.
      - name: Generate icons
        run: npx tauri icon Images/Icon/omoio-icon-1024.png

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Bash rather than PowerShell: the update key has no password, and
      # PowerShell drops a variable set to "", which leaves Tauri waiting for
      # one. Without the key secret the installer is still built, only without
      # the signature the in-app updater checks. The key is given to this step
      # only, never to the whole job.
      - name: Build installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build
          else
            echo "No update signing key; building without updater signature."
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      # The file the in-app updater reads from the latest release, written
      # from the installer's signature so it never has to be put together by
      # hand. Only with a signature, which needs the update key. The notes
      # come in through the environment, never pasted into the script.
      - name: Write latest.json
        shell: bash
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          sig=$(ls src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sig 2>/dev/null | head -n 1)
          if [ -z "$sig" ]; then
            echo "No signature, so no latest.json."
            exit 0
          fi
          SIG="$sig" node -e '
            const fs = require("fs");
            const path = require("path");
            const version = require("./src-tauri/tauri.conf.json").version;
            const exe = path.basename(process.env.SIG).replace(/\.sig$/, "");
            const latest = {
              version,
              notes: process.env.NOTES || "",
              pub_date: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
              platforms: {
                "windows-x86_64": {
                  signature: fs.readFileSync(process.env.SIG, "utf8"),
                  url: `https://github.com/Bertrram/omoio/releases/download/v${version}/${exe}`,
                },
              },
            };
            fs.writeFileSync(path.join(path.dirname(process.env.SIG), "latest.json"), JSON.stringify(latest, null, 2) + "\n");
          '
          cat src-tauri/target/release/bundle/nsis/latest.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omoio-installer
          path: |
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error

  # Puts an installer an earlier run built up as a release, with the
  # updater's latest.json beside it, when someone with write access asks
  # for it by hand. A job of its own, on another machine, so the token that
  # can publish is never next to the update key, and nothing is built here.
  publish:
    if: inputs.publish_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ inputs.publish_run }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          TARGET: ${{ inputs.target }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          gh run download "$RUN" --name omoio-installer --dir out
          ls -l out
          test -f out/latest.json
          printf '%s\n' "$NOTES" > notes.md
          gh release create "$TAG" out/*_x64-setup.exe out/latest.json \
            --target "$TARGET" --title "$TITLE" --notes-file notes.md
