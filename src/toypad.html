<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toy Pad</title>
  </head>
  <body>
    <!-- The LEGO Dimensions Toy Pad menu, in the same window as the portal
         menu and in its chrome (src/styles/portal.css paints #portal and the
         portal-* classes). Shown the moment the window opens, until the menu
         has asked the emulator what is on the Toy Pad. -->
    <div id="portal">
      <div class="portal-panel" role="dialog" aria-label="Toy Pad">
        <div class="portal-loading" role="status">
          <span class="portal-spinner" aria-hidden="true"></span>
          <p class="portal-loading-title">Loading the Toy Pad</p>
          <p class="portal-loading-note">Please wait a moment.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/toypad.ts"></script>
  </body>
</html>
